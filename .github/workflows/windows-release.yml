name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - windows-full
    paths:
      - "Sources/OpenKey/engine/**"
      - "Sources/OpenKey/win32/**"
      - ".github/workflows/windows-release.yml"
      - "LICENSE"
      - "NOTICE.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64
        shell: pwsh
        run: msbuild Sources/OpenKey/win32/OpenKey/NiceKey.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Build x86
        shell: pwsh
        run: msbuild Sources/OpenKey/win32/OpenKey/NiceKey.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Locate and test executables
        id: binaries
        shell: pwsh
        run: |
          $x64 = Get-ChildItem Sources/OpenKey/win32/OpenKey -Recurse -Filter NiceKey64.exe | Select-Object -First 1
          $x86 = Get-ChildItem Sources/OpenKey/win32/OpenKey -Recurse -Filter NiceKey32.exe | Select-Object -First 1
          if (-not $x64 -or -not $x86) { throw "Không tìm thấy đủ NiceKey64.exe và NiceKey32.exe" }
          $x64Test = Start-Process $x64.FullName -ArgumentList "--self-test" -Wait -PassThru
          if ($x64Test.ExitCode -ne 0) { throw "Self-test x64 thất bại: $($x64Test.ExitCode)" }
          $x86Test = Start-Process $x86.FullName -ArgumentList "--self-test" -Wait -PassThru
          if ($x86Test.ExitCode -ne 0) { throw "Self-test x86 thất bại: $($x86Test.ExitCode)" }
          "x64=$($x64.FullName)" >> $env:GITHUB_OUTPUT
          "x86=$($x86.FullName)" >> $env:GITHUB_OUTPUT

      - name: Create portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/portable/x64, dist/portable/x86, dist/portable/Licenses | Out-Null
          Copy-Item "${{ steps.binaries.outputs.x64 }}" dist/portable/x64/NiceKey64.exe
          Copy-Item "${{ steps.binaries.outputs.x86 }}" dist/portable/x86/NiceKey32.exe
          Copy-Item LICENSE dist/portable/Licenses/LICENSE.txt
          Copy-Item NOTICE.md dist/portable/Licenses/NOTICE.md
          Compress-Archive -Path dist/portable/* -DestinationPath dist/NiceKey-1.1.0-Windows-Portable.zip -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Không tìm thấy Inno Setup compiler" }
          & $iscc "/DSourceX64=${{ steps.binaries.outputs.x64 }}" "/DSourceX86=${{ steps.binaries.outputs.x86 }}" "/O$((Resolve-Path dist).Path)" Sources/OpenKey/win32/installer/NiceKey.iss
          if ($LASTEXITCODE -ne 0) { throw "Đóng gói installer thất bại: $LASTEXITCODE" }

      - name: Smoke-test installer
        shell: pwsh
        run: |
          $setup = (Resolve-Path dist/NiceKey-1.1.0-Windows-Setup.exe).Path
          $installDir = Join-Path $env:RUNNER_TEMP "NiceKeyInstallTest"
          $install = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Cài đặt NiceKey thất bại: $($install.ExitCode)" }

          $installedApp = Join-Path $installDir "NiceKey.exe"
          if (-not (Test-Path $installedApp)) { throw "Installer không tạo NiceKey.exe" }
          if (-not (Test-Path (Join-Path $installDir "Licenses/LICENSE.txt"))) { throw "Installer thiếu LICENSE.txt" }
          if (-not (Test-Path (Join-Path $installDir "Licenses/NOTICE.md"))) { throw "Installer thiếu NOTICE.md" }

          $selfTest = Start-Process $installedApp -ArgumentList "--self-test" -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "Self-test bản đã cài thất bại: $($selfTest.ExitCode)" }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Installer không tạo trình gỡ cài đặt" }
          $uninstall = Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Gỡ cài đặt NiceKey thất bại: $($uninstall.ExitCode)" }

      - name: Create checksums
        shell: pwsh
        run: |
          $lines = @()
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $($_.Name)"
          }
          $content = ($lines -join "`n") + "`n"
          [IO.File]::WriteAllText((Join-Path $PWD "dist/SHA256SUMS-Windows.txt"), $content, [Text.UTF8Encoding]::new($false))

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NiceKey-1.1.0-Windows
          path: |
            dist/NiceKey-1.1.0-Windows-Setup.exe
            dist/NiceKey-1.1.0-Windows-Portable.zip
            dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 14
